[ui]
theme = "dark"
show_nied_clock = false
sidebar_default_tab = "eew"
intensity_scale = "auto"
always_on_top = false
auto_follow_eew = true
auto_zoom_waves = true
show_wave_rings = true
show_legend = true

[map]
# auto = 暗色要石矢量 / 亮色地形瓦片；也可强制 vector | tiles | both
basemap = "auto"
geodata_dir = "geodata"
tile_base = "https://tilemap.sismotide.top"
# 自有海洋地形底图（亮色模式）
tile_source = "arcwob"
default_lon = 135.0
default_lat = 35.0
default_zoom = 5.0

[audio]
event_pack = "srev"
countdown_pack = "countdown"
master_volume = 0.8
countdown_volume = 1.0
mute = false

[travel]
primary = "jma2001"
fallback = "ak135"
linear_last_resort = true

[local]
# latitude = 35.68
# longitude = 139.76

[sources.jian]
enabled = true
# 兼容旧键：与 stations.jma_enabled + jma_source=jian 同步
station_enabled = true
# station_ws_url = "wss://api.sismotide.top/kmoni"

[sources.stations]
jma_enabled = true
# jian = Jian 中转 /kmoni；kmoni / lmoni = NIED 原版图像采样
jma_source = "jian"
jma_jian_ws = "wss://api.sismotide.top/kmoni"
snet_enabled = false
snet_source = "jian"
snet_jian_ws = "wss://api.sismotide.top/s-net"
kma_enabled = false
kma_jian_ws = "wss://api.sismotide.top/kma-station"

[sources.wolfx]
enabled = true
eew_enabled = true
eqlist_enabled = true

[sources.p2pquake]
enabled = true

[filters]
place_whitelist = ""

[filters.eew_agency]
jma = true
cea = true
cwa = true
kma = true
sa = true
early_est = true

