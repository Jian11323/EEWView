name: portable-linux

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p starquake-app --release
      - name: Pack
        run: python3 tools/pack_linux.py --skip-build --bin target/release/starquake
      - uses: actions/upload-artifact@v4
        with:
          name: StarQuake-linux-x86_64
          path: dist/StarQuake_*_linux_x86_64.tar.gz
