# 気象庁「気象情報の配色に関する設定指針」表２－２（令和2年7月）
# https://www.jma.go.jp/jma/kishou/info/colorguide/HPColorGuide_202007.pdf

source = "JMA HPColorGuide_202007 table 2-2"

[levels]
# level = [R, G, B]
"0" = [64, 64, 64]          # 震度 0 / 未着色（指针无专用警戒色）
"1" = [242, 242, 255]
"2" = [0, 170, 255]
"3" = [0, 65, 255]
"4" = [250, 230, 150]
"5" = [255, 230, 0]         # 5弱
"6" = [255, 153, 0]         # 5强
"7" = [255, 40, 0]          # 6弱
"8" = [165, 0, 33]          # 6强
"9" = [180, 0, 104]         # 7
