[package]
name = "starquake-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "starquake"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
starquake-ui = { workspace = true }
starquake-map = { workspace = true }
starquake-core = { workspace = true }
starquake-util = { workspace = true }
starquake-config = { workspace = true }
starquake-travel = { workspace = true }
starquake-net = { workspace = true }
starquake-audio = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
notify-rust = "4"
